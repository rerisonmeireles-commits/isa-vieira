{% extends "base.html" %}
{% block content %}

  <!-- Cabeçalho -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 mb-0">
      <i class="bi bi-chat-left-text me-2"></i>
      {{ titulo }}
    </h1>
  </div>

  <form method="post" class="card card-kpi p-3" novalidate>    
    {% csrf_token %}
    <div class="col-md-8">
    {% for field in form %}    
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for erro in field.errors %}<div class="text-danger small">{{ erro }}</div>{% endfor %}
      </div>
    {% endfor %}
    <div class="d-flex justify-content-end align-items-center gap-2">
            <a href="{% url 'communication:inbox' %}" class="btn btn-outline-secondary">  <i class="bi bi-x-lg me-1"></i> Cancelar </a>
            <button type="submit" class="btn btn-claro-primary"><i class="bi bi-send me-1"></i>Enviar</button>
    </div>
  </form>
  </div>
{% endblock %}
