{% extends "base.html" %}

{% block title %}Acesso negado{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="h3">Acesso negado</h1>
  <p class="text-muted">Sua conta não tem permissão para acessar esta área.</p>
  {% if user.is_authenticated %}
    <form method="post" action="{% url 'conta:logout' %}" class="d-inline">
      {% csrf_token %}
      <button class="btn btn-outline-secondary btn-sm">Sair e trocar de usuário</button>
    </form>
  {% endif %}
</div>
{% endblock %}
