{% extends "base.html" %}

{% block title %}Agenda{% endblock %}

{% block content %}

<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Agenda</h1>
    <form method="get" action="{% url 'scheduling:grade' %}" class="d-flex gap-2">
      <select name="profissional" class="form-select form-select-sm" onchange="this.form.submit()">
        {% for p in profissionais %}
          <option value="{{ p.id }}" {% if p.id == profissional.id %}selected{% endif %}>{{ p.nome_completo }}</option>
        {% endfor %}
      </select>
    </form>
  </div>

  {% if sem_profissionais %}
    <div class="alert alert-warning">
      Nenhum profissional ativo cadastrado. Cadastre um profissional com
      disponibilidade para gerar a grade.
    </div>
  {% else %}
    <div id="grade-container">
      {% include "scheduling/_grade.html" %}
    </div>
  {% endif %}
</div>
{% endblock %}
