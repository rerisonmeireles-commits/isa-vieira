{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Clínica Isa Vieira</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    /* Frame direito - escuro (gradiente) */
    .painel-esquerdo { background-color: #eaecee; }

    /* Frame esquerdo - claro, quase branco */
    .painel-direito {
      background: linear-gradient(135deg, #3b6474 0%, #001920 100%);
    }

    .box-login { max-width: 400px; width: 100%; }
    .logo-login { max-height: 130px; max-width: 220px; object-fit: contain; }
    .frase { font-style: italic; opacity: .92; }
  </style>
</head>
<body>
<div class="container-fluid p-0">
  <div class="row g-0 min-vh-100">

    <!-- FRAME ESQUERDO - Logo + boas-vindas (fundo escuro) -->
    <div class="col-md-6 painel-direito d-flex flex-column align-items-center justify-content-center text-center text-white p-4">
      <img src="{% static 'img/logo.png' %}" alt="Logo Clínica Isa Vieira"
           class="logo-login mb-4">
      <h1 class="h3 fw-bold mb-3">Bem vindo a Clínica Isa Vieira</h1>
      <p class="frase mb-0" style="max-width: 420px;">        
        "Cada exercício orientado é um passo a mais rumo à liberdade do movimento."
      </p>
    </div>

    <!-- FRAME DIREITO - Login (fundo claro) -->
    <div class="col-md-6 painel-esquerdo d-flex align-items-center justify-content-center p-4">
      <div class="box-login">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h1 class="h4 mb-3 fw-bold">Acesso ao Portal</h1>

            {% if form.non_field_errors %}
              <div class="alert alert-danger">{{ form.non_field_errors }}</div>
            {% endif %}

            <form method="post" novalidate>
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label" for="id_username">Usuário</label>
                <input type="text" name="username" id="id_username"
                       class="form-control" autofocus required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="id_password">Senha</label>
                <input type="password" name="password" id="id_password"
                       class="form-control" required>
              </div>
              <input type="hidden" name="next" value="{{ next }}">
              <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
