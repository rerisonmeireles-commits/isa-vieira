{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portal do Paciente{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="bg-light pb-5">

  <nav class="navbar bg-white border-bottom sticky-top">
    <div class="container">
      <span class="navbar-brand fw-semibold mb-0">Portal do Paciente</span>
      <a href="{% url 'portal:notificacoes' %}" class="nav-link position-relative">
        <i class="bi bi-bell fs-5"></i>
        {% if badge_notificacoes %}
          <span class="badge text-bg-danger position-absolute top-0 start-100 translate-middle">{{ badge_notificacoes }}</span>
        {% endif %}
      </a>
    </div>
  </nav>

  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}

    {% block portal_conteudo %}{% endblock %}
  </main>

  <!-- Barra fixa no rodapé (esboço: Início, Agendar, Treinos, Evolução, Perfil) -->
  <nav class="navbar fixed-bottom bg-white border-top">
    <div class="container justify-content-around">
      <a class="nav-link small text-center {% if request.path == '/portal/' %}active fw-semibold{% endif %}"
         href="{% url 'portal:home' %}"><i class="bi bi-house d-block"></i>Início</a>
      <a class="nav-link small text-center" href="{% url 'portal:agendar' %}"><i class="bi bi-calendar-plus d-block"></i>Agendar</a>
      <a class="nav-link small text-center" href="{% url 'portal:treinos' %}"><i class="bi-heart-pulse d-block"></i>Treinos</a>
      <a class="nav-link small text-center" href="{% url 'portal:evolucao' %}"><i class="bi bi-graph-up d-block"></i>Evolução</a>
      <a class="nav-link small text-center" href="{% url 'portal:perfil' %}"><i class="bi bi-person d-block"></i>Perfil</a>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
